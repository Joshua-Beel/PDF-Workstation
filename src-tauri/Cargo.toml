[package]
name = "pdf-workstation"
version = "0.3.1"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "=2.11.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "=0.9.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "=0.18.1"
rfd = "0.15"
tokio = { version = "1", features = ["sync"] }
lopdf = "=0.45.0"
tempfile = "3"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_ErrorReporting","Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
