name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch head on 2026-10-07

      - name: Restore Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ci-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
            ci-cargo-${{ runner.os }}-

      - run: npm ci
      - run: npm run fixtures
      - run: ./scripts/setup-pdfium.ps1
        shell: pwsh
      - name: Type-check
        run: npx tsc -b
      - name: Fetch locked Windows Cargo registry for offline notice checks
        run: cargo fetch --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
      - name: Verify bundled dependency notices are current
        run: node scripts/dependency-notices.mjs --check
      - run: npm test -- --pool=threads --maxWorkers=1 --no-file-parallelism
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bins

      - name: Save Cargo cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}

      - name: Recheck tracked source
        if: ${{ always() }}
        shell: pwsh
        run: |
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'CI changed tracked working-tree files.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'CI changed the tracked index.' }
