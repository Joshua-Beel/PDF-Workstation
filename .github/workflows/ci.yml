name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - id: toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch head on 2026-10-07

      - name: Restore Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci
      - run: npm run fixtures
      - run: ./scripts/setup-pdfium.ps1
        shell: pwsh
      - name: Fetch and verify the pinned qpdf for the annotation interchange check
        id: qpdf
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'qpdf'
          $lines = @(pwsh -NoProfile -NonInteractive -File ./scripts/setup-qpdf.ps1 -WorkRoot $root)
          if ($LASTEXITCODE -ne 0) { throw "setup-qpdf.ps1 exited with $LASTEXITCODE" }
          $found = @($lines | Where-Object { "$_".StartsWith('QPDF_EXE=') })
          if ($found.Count -ne 1) { throw 'setup-qpdf.ps1 did not print exactly one QPDF_EXE= line.' }
          $exe = "$($found[0])".Substring('QPDF_EXE='.Length)
          $prefix = [IO.Path]::GetFullPath($root).TrimEnd('\') + '\'
          if (-not $exe.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) -or -not $exe.EndsWith('\qpdf.exe', [StringComparison]::OrdinalIgnoreCase) -or $exe -match '[\r\n]') { throw "Unexpected QPDF_EXE path: $exe" }
          "exe=$exe" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Type-check
        run: npx tsc -b
      - name: Fetch locked Windows Cargo registry for offline notice checks
        run: cargo fetch --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
      - name: Verify bundled dependency notices are current
        run: node scripts/dependency-notices.mjs --check
      - run: npm test -- --pool=threads --maxWorkers=1 --no-file-parallelism
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bins
      - name: Annotation interchange check with the pinned qpdf (E2)
        shell: pwsh
        env:
          QPDF_EXE: ${{ steps.qpdf.outputs.exe }}
        run: |
          if (-not $env:QPDF_EXE) { throw 'QPDF_EXE is missing; E2 cannot run.' }
          $log = @(cargo test --locked --manifest-path src-tauri/Cargo.toml --bins annotations::qpdf_check::tests::qpdf_reads_the_interchange_fixtures_when_provided -- --ignored --exact 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          $log | Out-Host
          if ($code -ne 0) { throw "E2 failed with exit code $code" }
          if (@($log | Where-Object { $_ -match '^test result: ok\. 1 passed; 0 failed; 0 ignored;' }).Count -ne 1) { throw 'E2 did not run exactly one test.' }
      - name: Compile every test target
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-run

      - name: Keep only compiled dependencies in the Cargo cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $debug = 'src-tauri/target/debug'
          Remove-Item -LiteralPath (Join-Path $debug 'incremental'), (Join-Path $debug 'examples'), (Join-Path $debug 'resources') -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $debug -File -Filter 'pdf?workstation*' | Remove-Item -Force
          Get-ChildItem -LiteralPath (Join-Path $debug 'deps') -File -Filter 'pdf?workstation*' | Remove-Item -Force
          foreach ($dir in '.fingerprint', 'build') {
            Get-ChildItem -LiteralPath (Join-Path $debug $dir) -Directory -Filter 'pdf-workstation-*' | Remove-Item -Recurse -Force
          }
          $bytes = (Get-ChildItem -LiteralPath 'src-tauri/target' -Recurse -File -Force | Measure-Object -Property Length -Sum).Sum
          Write-Output ('CARGO_CACHE_TARGET_BYTES={0}' -f $bytes)

      - name: Save Cargo dependency cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ci-cargo-deps-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Recheck tracked source
        if: ${{ always() }}
        shell: pwsh
        run: |
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'CI changed tracked working-tree files.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'CI changed the tracked index.' }
