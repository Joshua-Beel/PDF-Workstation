name: Manual hosted npm diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-npm-diagnostic-${{ github.sha }}
  cancel-in-progress: false

jobs:
  installed-app-launch-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean dispatched source
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Checked-out HEAD does not match github.sha.' }
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked working-tree files changed after checkout.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'The tracked index changed after checkout.' }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - name: Verify hosted cross-drive topology
        shell: pwsh
        run: |
          $workspaceDrive = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)).TrimEnd('\')
          $tempDrive = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath([IO.Path]::GetTempPath())).TrimEnd('\')
          $workspaceDriveSet = $workspaceDrive -match '^[A-Za-z]:$'
          $tempDriveSet = $tempDrive -match '^[A-Za-z]:$'
          $drivesDiffer = $workspaceDriveSet -and $tempDriveSet -and -not $workspaceDrive.Equals($tempDrive,[StringComparison]::OrdinalIgnoreCase)
          Write-Output ('HOSTED_TOPOLOGY workspaceDriveSet={0} tempDriveSet={1} drivesDiffer={2}' -f $workspaceDriveSet.ToString().ToLowerInvariant(),$tempDriveSet.ToString().ToLowerInvariant(),$drivesDiffer.ToString().ToLowerInvariant())
          if (-not $drivesDiffer) { throw 'The hosted diagnostic requires repository and temporary paths on different drive letters.' }

      - run: npm ci

      - name: Run only the installed-app launch workflow test
        run: npx vitest run scripts/installed-app-launch-workflow.test.ts --maxWorkers=1 --reporter=verbose

      - name: Recheck tracked source
        if: ${{ always() }}
        shell: pwsh
        run: |
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'The diagnostic changed tracked working-tree files.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'The diagnostic changed the tracked index.' }
