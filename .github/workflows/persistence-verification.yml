name: Manual signed installed persistence verification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: signed-persistence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  persistence:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Require a manual master dispatch
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'Joshua-Beel/PDF-Workstation' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/master') {
            throw 'Dispatch this persistence verification only from the master branch.'
          }

      - name: Initialize fresh runner paths
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or [string]::IsNullOrWhiteSpace($env:GITHUB_ENV)) {
            throw 'GitHub-hosted runner path variables are unavailable.'
          }
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $values = @(
            "SIGNED_ARTIFACT_ROOT=$root\pdf-workstation-persistence-artifact"
            "PERSISTENCE_WORK_ROOT=$root\pdf-workstation-persistence-work"
            "PERSISTENCE_OUTPUT_ROOT=$root\pdf-workstation-persistence-output"
            "WEBDRIVER_ROOT=$root\pdf-workstation-persistence-webdriver"
            "WEBVIEW_PROFILE_ROOT=$root\pdf-workstation-persistence-profile"
          )
          $writer = [IO.StreamWriter]::new($env:GITHUB_ENV, $true, [Text.UTF8Encoding]::new($false))
          try { foreach ($value in $values) { $writer.WriteLine([string]$value) } } finally { $writer.Dispose() }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean dispatched and signed persistence source
        shell: pwsh
        run: |
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headRevision -cne $env:GITHUB_SHA) { throw 'Checked-out HEAD does not match github.sha.' }
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked working-tree files changed after checkout.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'The tracked index changed after checkout.' }
          $signedRevision = '67d238218f4796ba7b8505d072868da0f397174a'
          git cat-file -e "$signedRevision^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The exact signed source commit is unavailable.' }
          foreach ($path in @('src/preferences.ts','src/recentFiles.ts')) {
            $workflowBlob = (git rev-parse "${headRevision}:$path").Trim()
            $signedBlob = (git rev-parse "${signedRevision}:$path").Trim()
            if ($LASTEXITCODE -ne 0 -or $workflowBlob -cnotmatch '^[a-f0-9]{40,64}$' -or $workflowBlob -cne $signedBlob) {
              throw "Persistence storage source does not match the signed application: $path"
            }
          }
          $workflowAppBlob = (git rev-parse "${headRevision}:src/App.tsx").Trim()
          $signedAppBlob = (git rev-parse "${signedRevision}:src/App.tsx").Trim()
          if ($LASTEXITCODE -ne 0 -or $workflowAppBlob -cnotmatch '^[a-f0-9]{40,64}$' -or $signedAppBlob -cnotmatch '^[a-f0-9]{40,64}$') {
            throw 'Persistence application-shell source blobs could not be resolved.'
          }
          Write-Output ('SIGNED_PERSISTENCE_APP_SHELL matched={0}' -f ($workflowAppBlob -ceq $signedAppBlob).ToString().ToLowerInvariant())

      - name: Prepare exact hosted WebDriver inputs
        shell: pwsh
        run: |
          ./scripts/setup-installed-app-webdriver.ps1 -OutputRoot $env:WEBDRIVER_ROOT

      - name: Recheck clean source after driver preparation
        shell: pwsh
        run: |
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headRevision -cne $env:GITHUB_SHA) { throw 'Checked-out HEAD changed during WebDriver preparation.' }
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked working-tree files changed during WebDriver preparation.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'The tracked index changed during WebDriver preparation.' }

      - name: Verify exact signed artifact metadata
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path -LiteralPath $env:SIGNED_ARTIFACT_ROOT) { throw 'Signed artifact download root must be fresh.' }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $artifact = Invoke-RestMethod -Uri 'https://api.github.com/repos/Joshua-Beel/PDF-Workstation/actions/artifacts/11005152678' -Headers $headers
          if ([uint64]$artifact.id -ne 11005152678 -or
              [string]$artifact.name -cne 'signed-ocr-installer-67d238218f4796ba7b8505d072868da0f397174a' -or
              [uint64]$artifact.size_in_bytes -ne 10437483 -or
              [string]$artifact.digest -cne 'sha256:c0e89b5ae821d5875c31855c6596a7d47b7ca052468a026745a5d638e50ca569' -or
              [uint64]$artifact.workflow_run.id -ne 36499724415 -or
              [string]$artifact.workflow_run.head_sha -cne '67d238218f4796ba7b8505d072868da0f397174a' -or
              [bool]$artifact.expired) {
            throw 'Signed OCR artifact metadata does not match the pinned successful run.'
          }

      - name: Download exact signed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '11005152678'
          github-token: ${{ github.token }}
          repository: Joshua-Beel/PDF-Workstation
          run-id: '36499724415'
          merge-multiple: true
          path: ${{ env.SIGNED_ARTIFACT_ROOT }}

      - name: Verify signed installed persistence across restarts
        shell: pwsh
        run: |
          ./scripts/verify-signed-persistence.ps1 `
            -SignedArtifactRoot $env:SIGNED_ARTIFACT_ROOT `
            -WorkRoot $env:PERSISTENCE_WORK_ROOT `
            -OutputRoot $env:PERSISTENCE_OUTPUT_ROOT `
            -WebDriverRoot $env:WEBDRIVER_ROOT `
            -WebViewProfileRoot $env:WEBVIEW_PROFILE_ROOT

      - name: Upload only sanitized persistence verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-persistence-verification-${{ github.sha }}
          path: ${{ env.PERSISTENCE_OUTPUT_ROOT }}/persistence-verification.json
          if-no-files-found: error
