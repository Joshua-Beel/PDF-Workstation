name: Manual signed reading tools verification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: signed-reading-tools-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reading-tools:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Require a manual master dispatch
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'Joshua-Beel/PDF-Workstation' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/master') {
            throw 'Dispatch reading-tools verification only from the master branch.'
          }

      - name: Initialize fresh runner paths
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or [string]::IsNullOrWhiteSpace($env:GITHUB_ENV)) {
            throw 'GitHub-hosted runner path variables are unavailable.'
          }
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $values = @(
            "BASELINE_ROOT=$root\pdf-workstation-reading-baseline"
            "SIGNED_ARTIFACT_ROOT=$root\pdf-workstation-reading-signed-artifact"
            "UPGRADE_WORK_ROOT=$root\pdf-workstation-reading-upgrade-work"
            "UPGRADE_OUTPUT_ROOT=$root\pdf-workstation-reading-upgrade-output"
            "WEBDRIVER_ROOT=$root\pdf-workstation-reading-webdriver"
            "UPGRADE_PROFILE_ROOT=$root\pdf-workstation-reading-upgrade-profile"
            "READING_WORK_ROOT=$root\pdf-workstation-reading-work"
            "READING_OUTPUT_ROOT=$root\pdf-workstation-reading-output"
            "READING_PROFILE_ROOT=$root\pdf-workstation-reading-profile"
          )
          $writer = [IO.StreamWriter]::new($env:GITHUB_ENV, $true, [Text.UTF8Encoding]::new($false))
          try { foreach ($value in $values) { $writer.WriteLine([string]$value) } } finally { $writer.Dispose() }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact clean dispatched source
        shell: pwsh
        run: |
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headRevision -cne $env:GITHUB_SHA) { throw 'Checked-out HEAD does not match github.sha.' }
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked working-tree files changed after checkout.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'The tracked index changed after checkout.' }
          git cat-file -e '67d238218f4796ba7b8505d072868da0f397174a^{commit}'
          if ($LASTEXITCODE -ne 0) { throw 'The exact signed source commit is unavailable.' }

      - name: Prepare exact hosted WebDriver inputs
        shell: pwsh
        run: |
          ./scripts/setup-installed-app-webdriver.ps1 -OutputRoot $env:WEBDRIVER_ROOT

      - name: Download the exact published 0.2.0 baseline asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path -LiteralPath $env:BASELINE_ROOT) { throw 'Baseline download root must be fresh.' }
          [IO.Directory]::CreateDirectory($env:BASELINE_ROOT) | Out-Null
          $headers = @{ Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28' }
          $asset = Invoke-RestMethod -Uri 'https://api.github.com/repos/Joshua-Beel/PDF-Workstation/releases/assets/569181842' -Headers $headers
          if ([uint64]$asset.id -ne 569181842 -or [string]$asset.name -cne 'PDF.Workstation_0.2.0_x64-setup.exe' -or
              [uint64]$asset.size -ne 6418229 -or [string]$asset.digest -cne 'sha256:17788cb82bb42deac35ea197a385a9bafc8cd331422446a2b834e115a90c4d2e') {
            throw 'Published baseline metadata does not match its exact pin.'
          }
          $headers.Accept = 'application/octet-stream'
          Invoke-WebRequest -Uri 'https://api.github.com/repos/Joshua-Beel/PDF-Workstation/releases/assets/569181842' -Headers $headers -OutFile (Join-Path $env:BASELINE_ROOT $asset.name)

      - name: Verify exact signed artifact metadata
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path -LiteralPath $env:SIGNED_ARTIFACT_ROOT) { throw 'Signed artifact root must be fresh.' }
          $headers = @{ Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28' }
          $artifact = Invoke-RestMethod -Uri 'https://api.github.com/repos/Joshua-Beel/PDF-Workstation/actions/artifacts/11005152678' -Headers $headers
          if ([uint64]$artifact.id -ne 11005152678 -or [string]$artifact.name -cne 'signed-ocr-installer-67d238218f4796ba7b8505d072868da0f397174a' -or
              [uint64]$artifact.size_in_bytes -ne 10437483 -or [string]$artifact.digest -cne 'sha256:c0e89b5ae821d5875c31855c6596a7d47b7ca052468a026745a5d638e50ca569' -or
              [uint64]$artifact.workflow_run.id -ne 36499724415 -or [string]$artifact.workflow_run.head_sha -cne '67d238218f4796ba7b8505d072868da0f397174a' -or [bool]$artifact.expired) {
            throw 'Signed artifact metadata does not match the exact successful run.'
          }

      - name: Download the exact signed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '11005152678'
          github-token: ${{ github.token }}
          repository: Joshua-Beel/PDF-Workstation
          run-id: '36499724415'
          merge-multiple: true
          path: ${{ env.SIGNED_ARTIFACT_ROOT }}

      - name: Install the receipt-bound signed app
        shell: pwsh
        run: |
          ./scripts/verify-signed-ocr-upgrade.ps1 `
            -BaselineInstaller (Join-Path $env:BASELINE_ROOT 'PDF.Workstation_0.2.0_x64-setup.exe') `
            -SignedArtifactRoot $env:SIGNED_ARTIFACT_ROOT `
            -WorkRoot $env:UPGRADE_WORK_ROOT `
            -OutputRoot $env:UPGRADE_OUTPUT_ROOT `
            -WebDriverRoot $env:WEBDRIVER_ROOT `
            -WebViewProfileRoot $env:UPGRADE_PROFILE_ROOT

      - name: Verify installed selection search and password flows
        shell: pwsh
        run: |
          ./scripts/verify-signed-reading-tools.ps1 `
            -SignedArtifactRoot $env:SIGNED_ARTIFACT_ROOT `
            -WorkRoot $env:READING_WORK_ROOT `
            -OutputRoot $env:READING_OUTPUT_ROOT `
            -WebDriverRoot $env:WEBDRIVER_ROOT `
            -WebViewProfileRoot $env:READING_PROFILE_ROOT

      - name: Upload only the sanitized reading-tools record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-reading-tools-verification-${{ github.sha }}
          path: ${{ env.READING_OUTPUT_ROOT }}/reading-tools-verification.json
          if-no-files-found: error
