name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {}
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
    env:
      OCR_SETUP_ROOT: target/ocr-release-setup-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_PROOF_ROOT: target/ocr-release-build-${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_PUBLISHER: Joshua Beel
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch head on 2026-10-07
      - name: Validate release version and signing setup
        id: validate
        shell: pwsh
        env:
          UPDATER_KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          foreach ($name in @('AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE')) {
            $setting = [Environment]::GetEnvironmentVariable($name)
            if ($setting) {
              $mask = $setting.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::add-mask::$mask"
            }
            if ([string]::IsNullOrWhiteSpace($setting)) { throw "Add release environment secret: $name" }
          }
          if ($env:UPDATER_KEY_PRESENT -cne 'true') { throw 'TAURI_SIGNING_PRIVATE_KEY is missing. Restore the updater key that installed apps trust (scripts/updater-signing-key.json); see docs/releases.md, Updater key rotation.' }
          foreach ($name in @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Add release environment secret: $name" }
          }
          if ($env:GITHUB_REF_TYPE -cne 'tag' -or $env:GITHUB_REF_NAME -cnotmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw 'Run this workflow on an exact stable vMAJOR.MINOR.PATCH tag.'
          }
          $version = $Matches.version
          ./scripts/assert-release-version.ps1 -ProjectRoot (Get-Location).Path -Version $version
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve checked-out HEAD.' }
          $tagCommit = (git rev-parse "$($env:GITHUB_REF_NAME)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the release tag commit.' }
          if ($head -cne $env:GITHUB_SHA -or $tagCommit -cne $env:GITHUB_SHA) {
            throw 'Checked-out source, workflow source SHA, and release tag commit must be identical.'
          }
          git rev-parse --verify --quiet refs/remotes/origin/master | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'origin/master is not available to check the release commit against.' }
          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must point to a commit that is already on origin/master.' }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Release source has tracked working-tree changes.' }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Release source has staged changes.' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_VERSION=$version`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n", [Text.UTF8Encoding]::new($false))
      - name: Check the embedded updater public key before building
        shell: pwsh
        run: ./scripts/assert-updater-signing-key.ps1 -SourceRoot (Get-Location).Path
      - run: npm ci
      - run: npm run fixtures
      - run: ./scripts/setup-pdfium.ps1
        shell: pwsh
      - name: Fetch locked Windows Cargo registry for offline notice checks
        run: cargo fetch --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
      - name: Verify bundled dependency notices are current
        run: node scripts/dependency-notices.mjs --check
      - run: npm test -- --pool=threads --maxWorkers=1 --no-file-parallelism
      - run: ./scripts/run-native-recovery-gates.ps1
        shell: pwsh
      - name: Build the pinned unsigned OCR setup
        shell: pwsh
        run: ./scripts/setup-ocr.ps1 -OutputRoot $env:OCR_SETUP_ROOT -Jobs 4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'
      - name: Install Azure Artifact Signing CLI
        run: cargo install artifact-signing-cli --version 0.11.0 --locked
      - name: Build publisher-signed installer with OCR and signed update manifest
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -AzureSigning `
            -OcrSetupRoot $env:OCR_SETUP_ROOT `
            -OutputRoot $env:RELEASE_PROOF_ROOT `
            -ExpectedPublisher $env:EXPECTED_PUBLISHER `
            -SourceRevision $env:GITHUB_SHA
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
      - name: Verify the release OCR installer proof
        shell: pwsh
        run: |
          $receipt = Get-Content -LiteralPath (Join-Path $env:RELEASE_PROOF_ROOT 'installer-verification.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($receipt.mode -cne 'azure-signed-release-ocr' -or $receipt.sourceRevision -cne $env:GITHUB_SHA -or -not $receipt.ocr.enabled -or @($receipt.ocr.packagedResources).Count -ne 5 -or
              $receipt.signatures.expectedPublisher -cne $env:EXPECTED_PUBLISHER -or $receipt.signatures.installer -cne 'Valid' -or $receipt.signatures.application -cne 'Valid' -or
              $receipt.signatures.engine -cne 'Valid' -or $receipt.signatures.originalEngine -cne 'NotSigned') {
            throw 'The release installer proof did not package the publisher-signed OCR engine, model, and license texts.'
          }
          Write-Output ('RELEASE_OCR_PROOF identity={0} setupManifestSha256={1} installerBytes={2} installerSha256={3}' -f $receipt.ocr.identity, $receipt.ocr.setupManifestSha256, $receipt.installer.bytes, $receipt.installer.sha256)
      - name: Verify exact release asset inventory
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $installerName = "PDF Workstation_$($env:RELEASE_VERSION)_x64-setup.exe"
          $expected = @($installerName, "$installerName.sig", 'latest.json') | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $bundle -File | ForEach-Object Name | Sort-Object)
          if ($actual.Count -ne 3 -or (Compare-Object -ReferenceObject $expected -DifferenceObject $actual -CaseSensitive)) {
            throw 'Release bundle must contain exactly the installer, its detached updater signature, and latest.json.'
          }
          foreach ($name in $expected) {
            $path = Join-Path $bundle $name
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Release asset is empty: $name" }
          }
          $manifest = Get-Content (Join-Path $bundle 'latest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $platform = $manifest.platforms.'windows-x86_64'
          $signature = (Get-Content (Join-Path $bundle "$installerName.sig") -Raw -Encoding UTF8).Trim()
          $assetName = $installerName.Replace(' ', '.')
          $expectedUrl = "https://github.com/Joshua-Beel/PDF-Workstation/releases/download/v$($env:RELEASE_VERSION)/$assetName"
          $notes = Get-Content docs/release-notes.md -Raw -Encoding UTF8
          if ($manifest.version -cne $env:RELEASE_VERSION -or $platform.url -cne $expectedUrl -or $platform.signature -cne $signature -or $manifest.notes -cne $notes) {
            throw 'Updater manifest is not bound to the exact version, installer, detached signature, and release notes.'
          }
          $signatureText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($signature))
          $trusted = @($signatureText -split "`r?`n" | Where-Object { $_ -clike 'trusted comment: *' })
          $signedFiles = @(if ($trusted.Count -eq 1) { $trusted[0].Substring(17) -split "`t" | Where-Object { $_ -clike 'file:*' } | ForEach-Object { $_.Substring(5) } })
          if ($trusted.Count -ne 1 -or $signedFiles.Count -ne 1 -or $signedFiles[0] -cne $installerName) {
            throw 'Updater signature does not name the exact installer in its trusted comment; installed clients would refuse this update.'
          }
          ./scripts/assert-updater-signing-key.ps1 -SignaturePath (Join-Path $bundle "$installerName.sig") -SourceRoot (Get-Location).Path
          node scripts/verify-updater-signature.mjs (Join-Path $bundle $installerName) (Join-Path $bundle "$installerName.sig") scripts/updater-signing-key.json
          if ($LASTEXITCODE -ne 0) { throw 'The updater signature does not verify against the key that installed apps trust.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/PDF Workstation_${{ env.RELEASE_VERSION }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/PDF Workstation_${{ env.RELEASE_VERSION }}_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes
          path: docs/release-notes.md
          if-no-files-found: error
  publish:
    needs: installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: windows-installer
          path: release-assets
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-notes
          path: release-notes
      - name: Verify downloaded release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.installer.outputs.version }}
        run: |
          if ($env:RELEASE_VERSION -cnotmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_TYPE -cne 'tag' -or $env:GITHUB_REF_NAME -cne "v$($env:RELEASE_VERSION)") {
            throw 'Publish only the exact stable tag that the installer job validated.'
          }
          $installerName = "PDF Workstation_$($env:RELEASE_VERSION)_x64-setup.exe"
          $expected = @($installerName, "$installerName.sig", 'latest.json') | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath release-assets -File -Recurse | ForEach-Object Name | Sort-Object)
          if ($actual.Count -ne 3 -or (Compare-Object -ReferenceObject $expected -DifferenceObject $actual -CaseSensitive)) {
            throw 'Downloaded release assets must be exactly the installer, its detached updater signature, and latest.json.'
          }
          $notesFiles = @(Get-ChildItem -LiteralPath release-notes -File -Recurse)
          if ($notesFiles.Count -ne 1 -or $notesFiles[0].Name -cne 'release-notes.md') { throw 'Downloaded release notes must be exactly release-notes.md.' }
          $manifest = Get-Content (Join-Path release-assets 'latest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $signature = (Get-Content (Join-Path release-assets "$installerName.sig") -Raw -Encoding UTF8).Trim()
          $notes = Get-Content $notesFiles[0].FullName -Raw -Encoding UTF8
          $expectedUrl = "https://github.com/Joshua-Beel/PDF-Workstation/releases/download/v$($env:RELEASE_VERSION)/$($installerName.Replace(' ', '.'))"
          if ($manifest.version -cne $env:RELEASE_VERSION -or $manifest.platforms.'windows-x86_64'.url -cne $expectedUrl -or $manifest.platforms.'windows-x86_64'.signature -cne $signature -or $manifest.notes -cne $notes) {
            throw 'Downloaded updater manifest is not bound to the exact version, installer URL, detached signature, and release notes.'
          }
          $signatureText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($signature))
          $trusted = @($signatureText -split "`r?`n" | Where-Object { $_ -clike 'trusted comment: *' })
          $signedFiles = @(if ($trusted.Count -eq 1) { $trusted[0].Substring(17) -split "`t" | Where-Object { $_ -clike 'file:*' } | ForEach-Object { $_.Substring(5) } })
          if ($trusted.Count -ne 1 -or $signedFiles.Count -ne 1 -or $signedFiles[0] -cne $installerName) {
            throw 'Downloaded updater signature does not name the exact installer in its trusted comment.'
          }
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.installer.outputs.version }}
        run: |
          $bundle = 'release-assets'
          $installerName = "PDF Workstation_$($env:RELEASE_VERSION)_x64-setup.exe"
          $assets = @(
            (Join-Path $bundle $installerName),
            (Join-Path $bundle "$installerName.sig"),
            (Join-Path $bundle 'latest.json')
          )
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --draft --target $env:GITHUB_SHA --title "PDF Workstation $env:GITHUB_REF_NAME" --notes-file release-notes/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed. Existing releases are never overwritten.' }
          $releaseJson = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the created draft release.' }
          $release = $releaseJson | ConvertFrom-Json
          $expectedNames = @($installerName.Replace(' ', '.'), ($installerName.Replace(' ', '.') + '.sig'), 'latest.json') | Sort-Object
          $actualNames = @($release.assets | ForEach-Object name | Sort-Object)
          if ($release.tagName -cne $env:GITHUB_REF_NAME -or -not $release.isDraft -or $release.isPrerelease -or $release.targetCommitish -cne $env:GITHUB_SHA -or $actualNames.Count -ne 3 -or (Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames -CaseSensitive)) {
            throw 'Created release is not the exact source-bound draft with the required three assets.'
          }
