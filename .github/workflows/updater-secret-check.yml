name: Updater signing secret check
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: updater-secret-check
  cancel-in-progress: false
jobs:
  master-only:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Refuse anything but master
        shell: bash
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            echo 'Run the updater secret check from master only.'
            exit 1
          fi
  check:
    needs: master-only
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
    steps:
      - name: Refuse anything but master
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/master') { throw 'Run the updater secret check from master only.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Sign a throwaway file and verify it against the pinned release key
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "updater-secret-check-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          node scripts/updater-secret-check.mjs $root scripts/updater-signing-key.json
          if ($LASTEXITCODE -ne 0) { throw 'The updater signing secrets do not produce a signature that verifies against releaseSigningPublicKey.' }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Remove the throwaway file and signature
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "updater-secret-check-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $root) { throw 'The throwaway check folder could not be removed.' }
