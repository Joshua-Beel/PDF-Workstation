name: Manual Windows validation

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner image; windows-2022 matches the release installer job
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-latest

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.sha }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      OCR_SETUP_ROOT: target/ocr-validation-setup-${{ github.run_id }}-${{ github.run_attempt }}
      INSTALLER_PROOF_ROOT: target/ocr-validation-installer-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean dispatched source
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Checked-out HEAD does not match github.sha.' }
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked working-tree files changed after checkout.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'The tracked index changed after checkout.' }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch head on 2026-10-07

      - name: Verify hosted cross-drive topology
        shell: pwsh
        run: |
          $workspaceDrive = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)).TrimEnd('\')
          $tempDrive = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath([IO.Path]::GetTempPath())).TrimEnd('\')
          $workspaceDriveSet = $workspaceDrive -match '^[A-Za-z]:$'
          $tempDriveSet = $tempDrive -match '^[A-Za-z]:$'
          $drivesDiffer = $workspaceDriveSet -and $tempDriveSet -and -not $workspaceDrive.Equals($tempDrive,[StringComparison]::OrdinalIgnoreCase)
          Write-Output ('HOSTED_TOPOLOGY workspaceDriveSet={0} tempDriveSet={1} drivesDiffer={2}' -f $workspaceDriveSet.ToString().ToLowerInvariant(),$tempDriveSet.ToString().ToLowerInvariant(),$drivesDiffer.ToString().ToLowerInvariant())
          if (-not $drivesDiffer) { throw 'Windows validation requires repository and temporary paths on different drive letters.' }

      - run: npm ci
      - run: npm run fixtures
      - run: ./scripts/setup-pdfium.ps1
        shell: pwsh
      - name: Fetch locked Windows Cargo registry for offline notice checks
        run: cargo fetch --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
      - name: Verify bundled dependency notices are current
        run: node scripts/dependency-notices.mjs --check
      - run: npm test -- --pool=threads --maxWorkers=1 --no-file-parallelism
      - run: ./scripts/run-native-recovery-gates.ps1
        shell: pwsh
      - run: npm run build

      - name: Build the pinned unsigned OCR setup
        shell: pwsh
        run: ./scripts/setup-ocr.ps1 -OutputRoot $env:OCR_SETUP_ROOT -Jobs 4

      - name: Build and verify the unsigned default installer with OCR
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 `
            -UnsignedLocal `
            -OcrSetupRoot $env:OCR_SETUP_ROOT `
            -OutputRoot $env:INSTALLER_PROOF_ROOT `
            -SourceRevision $env:GITHUB_SHA
          $receipt = Get-Content -LiteralPath (Join-Path $env:INSTALLER_PROOF_ROOT 'installer-verification.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($receipt.mode -cne 'unsigned-local-ocr' -or $receipt.sourceRevision -cne $env:GITHUB_SHA -or -not $receipt.ocr.enabled -or @($receipt.ocr.packagedResources).Count -ne 5) {
            throw 'The unsigned default installer proof did not package the verified OCR engine, model, and license texts.'
          }
          Write-Output ('OCR_INSTALLER_PROOF installerBytes={0} ocrResources={1}' -f $receipt.installer.bytes, @($receipt.ocr.packagedResources).Count)

      - name: Recheck tracked source
        if: ${{ always() }}
        shell: pwsh
        run: |
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'Windows validation changed tracked working-tree files.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'Windows validation changed the tracked index.' }
