name: Manual signed OCR installer upgrade verification

on:
  workflow_dispatch:
    inputs:
      target_version: { required: true, type: string }
      source_revision: { required: true, type: string }
      artifact_run_id: { required: true, type: string }
      artifact_id: { required: true, type: string }
      artifact_name: { required: true, type: string }
      artifact_bytes: { required: true, type: string }
      artifact_digest: { required: true, type: string }
      installer_name: { required: true, type: string }
      installer_bytes: { required: true, type: string }
      installer_sha256: { required: true, type: string }
      record_bytes: { required: true, type: string }
      record_sha256: { required: true, type: string }

permissions:
  contents: read
  actions: read

concurrency:
  group: signed-ocr-upgrade-${{ github.sha }}
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      TARGET_VERSION: ${{ inputs.target_version }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      ARTIFACT_BYTES: ${{ inputs.artifact_bytes }}
      ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      INSTALLER_NAME: ${{ inputs.installer_name }}
      INSTALLER_BYTES: ${{ inputs.installer_bytes }}
      INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
      RECORD_BYTES: ${{ inputs.record_bytes }}
      RECORD_SHA256: ${{ inputs.record_sha256 }}
    steps:
      - name: Require a manual master dispatch
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'Joshua-Beel/PDF-Workstation' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/master') {
            throw 'Dispatch this upgrade verification only from the master branch.'
          }

      - name: Initialize fresh runner paths
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or [string]::IsNullOrWhiteSpace($env:GITHUB_ENV)) {
            throw 'GitHub-hosted runner path variables are unavailable.'
          }
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $values = @(
            "BASELINE_ROOT=$root\pdf-workstation-baseline"
            "SIGNED_ARTIFACT_ROOT=$root\pdf-workstation-signed-artifact"
            "UPGRADE_WORK_ROOT=$root\pdf-workstation-upgrade-work"
            "UPGRADE_OUTPUT_ROOT=$root\pdf-workstation-upgrade-output"
            "WEBDRIVER_ROOT=$root\pdf-workstation-webdriver"
            "WEBVIEW_PROFILE_ROOT=$root\pdf-workstation-webview-profile"
          )
          $writer = [IO.StreamWriter]::new($env:GITHUB_ENV, $true, [Text.UTF8Encoding]::new($false))
          try {
            foreach ($value in $values) { $writer.WriteLine([string]$value) }
          } finally {
            $writer.Dispose()
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact clean dispatched source
        shell: pwsh
        run: |
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headRevision -cne $env:GITHUB_SHA) {
            throw 'Checked-out HEAD does not match github.sha.'
          }
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked working-tree files changed after checkout.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'The tracked index changed after checkout.' }
          . ./scripts/signed-check-inputs.ps1
          $null = Get-SignedCheckInputs -TargetVersion $env:TARGET_VERSION -SourceRevision $env:SOURCE_REVISION -ArtifactRunId $env:ARTIFACT_RUN_ID -ArtifactId $env:ARTIFACT_ID -ArtifactName $env:ARTIFACT_NAME -ArtifactBytes $env:ARTIFACT_BYTES -ArtifactDigest $env:ARTIFACT_DIGEST -InstallerName $env:INSTALLER_NAME -InstallerBytes $env:INSTALLER_BYTES -InstallerSha256 $env:INSTALLER_SHA256 -RecordBytes $env:RECORD_BYTES -RecordSha256 $env:RECORD_SHA256
          git cat-file -e "$env:SOURCE_REVISION^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The exact signed source commit is unavailable.' }
          git merge-base --is-ancestor $env:SOURCE_REVISION HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The signed source revision is not on the dispatched master history.' }

      - name: Prepare exact hosted WebDriver inputs
        shell: pwsh
        run: |
          ./scripts/setup-installed-app-webdriver.ps1 -OutputRoot $env:WEBDRIVER_ROOT

      - name: Recheck clean source after driver preparation
        shell: pwsh
        run: |
          $headRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headRevision -cne $env:GITHUB_SHA) {
            throw 'Checked-out HEAD changed during WebDriver preparation.'
          }
          git diff --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'Tracked working-tree files changed during WebDriver preparation.' }
          git diff --cached --quiet --
          if ($LASTEXITCODE -ne 0) { throw 'The tracked index changed during WebDriver preparation.' }

      - name: Verify exact signed artifact metadata
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path -LiteralPath $env:SIGNED_ARTIFACT_ROOT) { throw 'Signed artifact download root must be fresh.' }
          ./scripts/assert-signed-artifact-metadata.ps1 -TargetSourceRevision $env:SOURCE_REVISION -ArtifactRunId $env:ARTIFACT_RUN_ID -ArtifactId $env:ARTIFACT_ID -ArtifactName $env:ARTIFACT_NAME -ArtifactBytes $env:ARTIFACT_BYTES -ArtifactDigest $env:ARTIFACT_DIGEST

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 1
          persist-credentials: false
          path: target-source

      - name: Prepare exact pinned PDFium resources in the signed source
        shell: pwsh
        run: ./scripts/prepare-default-draft-pdfium.ps1 -TargetSourceRoot (Resolve-Path target-source).Path -WorkRoot (Join-Path $env:RUNNER_TEMP 'upgrade-pdfium-prep')

      - name: Download the exact published 0.2.0 baseline asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path -LiteralPath $env:BASELINE_ROOT) { throw 'Baseline download root must be fresh.' }
          [IO.Directory]::CreateDirectory($env:BASELINE_ROOT) | Out-Null
          $api = 'https://api.github.com/repos/Joshua-Beel/PDF-Workstation/releases/assets/569181842'
          $jsonHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $asset = Invoke-RestMethod -Uri $api -Headers $jsonHeaders
          if ([uint64]$asset.id -ne 569181842 -or
              [string]$asset.name -cne 'PDF.Workstation_0.2.0_x64-setup.exe' -or
              [uint64]$asset.size -ne 6418229 -or
              [string]$asset.digest -cne 'sha256:17788cb82bb42deac35ea197a385a9bafc8cd331422446a2b834e115a90c4d2e') {
            throw 'Published 0.2.0 asset metadata does not match the pinned baseline.'
          }
          $downloadHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Uri $api -Headers $downloadHeaders -OutFile (Join-Path $env:BASELINE_ROOT $asset.name)

      - name: Download the exact signed OCR artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: Joshua-Beel/PDF-Workstation
          run-id: ${{ inputs.artifact_run_id }}
          merge-multiple: true
          path: ${{ env.SIGNED_ARTIFACT_ROOT }}

      - name: Verify isolated silent install and manual upgrade
        shell: pwsh
        run: |
          ./scripts/verify-signed-ocr-upgrade.ps1 `
            -BaselineInstaller (Join-Path $env:BASELINE_ROOT 'PDF.Workstation_0.2.0_x64-setup.exe') `
            -SignedArtifactRoot $env:SIGNED_ARTIFACT_ROOT `
            -WorkRoot $env:UPGRADE_WORK_ROOT `
            -OutputRoot $env:UPGRADE_OUTPUT_ROOT `
            -WebDriverRoot $env:WEBDRIVER_ROOT `
            -WebViewProfileRoot $env:WEBVIEW_PROFILE_ROOT `
            -PublisherUiMode HostedNonInteractive `
            -TargetSourceRoot (Resolve-Path target-source).Path `
            -TargetVersion $env:TARGET_VERSION -SourceRevision $env:SOURCE_REVISION `
            -ArtifactRunId $env:ARTIFACT_RUN_ID -ArtifactId $env:ARTIFACT_ID -ArtifactName $env:ARTIFACT_NAME `
            -ArtifactBytes $env:ARTIFACT_BYTES -ArtifactDigest $env:ARTIFACT_DIGEST `
            -InstallerName $env:INSTALLER_NAME -InstallerBytes $env:INSTALLER_BYTES -InstallerSha256 $env:INSTALLER_SHA256 `
            -RecordBytes $env:RECORD_BYTES -RecordSha256 $env:RECORD_SHA256

      - name: Upload only the sanitized upgrade verification record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-ocr-upgrade-verification-${{ github.sha }}
          path: ${{ env.UPGRADE_OUTPUT_ROOT }}/upgrade-verification.json
          if-no-files-found: error
